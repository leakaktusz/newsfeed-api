<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NewsFeed</title>
  <style>
    :root { --line: #e3e6ea; --muted: #6b7280; --accent: #1f3a5f; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto;
           padding: 0 1rem; color: #111; line-height: 1.5; }
    h1 { color: var(--accent); }
    form { display: grid; gap: .5rem; border: 1px solid var(--line);
           border-radius: 8px; padding: 1rem; margin-bottom: 2rem; }
    input, textarea { font: inherit; padding: .5rem; border: 1px solid var(--line); border-radius: 6px; }
    button { font: inherit; padding: .5rem 1rem; border: 0; border-radius: 6px;
             background: var(--accent); color: #fff; cursor: pointer; }
    article { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    article h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .meta { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
    .tag { display: inline-block; background: #eef2f7; border-radius: 999px;
           padding: .1rem .6rem; font-size: .75rem; margin-right: .3rem; }
  </style>
</head>
<body>
  <h1>NewsFeed</h1>

  <form id="new-article">
    <input id="title" placeholder="Title" required />
    <input id="author" placeholder="Author" required />
    <textarea id="body" placeholder="Body" rows="3" required></textarea>
    <input id="tags" placeholder="Tags, comma separated" />
    <button type="submit">Publish</button>
  </form>

  <div id="articles"></div>

  <script>
    const list = document.getElementById('articles');

    async function loadArticles() {
      const res = await fetch('/articles');
      const articles = await res.json();
      list.innerHTML = '';
      for (const a of articles) {
        const el = document.createElement('article');

        const h2 = document.createElement('h2');
        h2.textContent = a.title;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${a.author} · ${new Date(a.publishedAt).toLocaleString('da-DK')}`;

        const body = document.createElement('p');
        body.textContent = a.body;

        el.append(h2, meta, body);

        for (const t of a.tags ?? []) {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = t;
          el.append(tag);
        }
        list.append(el);
      }
    }

    
    async function createArticle(event) {
        event.preventDefault();
      
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const body = document.getElementById('body').value;
        const tags = document.getElementById('tags').value
        .split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0);
      
      const res = await fetch('/articles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body, author, tags })
      });

      if (res.ok) {
          event.target.reset();
          await loadArticles();
        } else {
          alert('Could not create the article: ' + res.status);
        }
      
    }

    document.getElementById('new-article').addEventListener('submit', createArticle);
    loadArticles();
  </script>
</body>
</html>
